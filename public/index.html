<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StageLink Live - Engineer Dashboard</title>
  <style>
    body { background-color: #121212; color: #fff; font-family: monospace; padding: 20px; }
    #stage { width: 100%; height: 400px; background: #1e1e1e; border: 2px solid #333; position: relative; margin-top: 20px; border-radius: 8px; }
    .musician-node { width: 40px; height: 40px; border-radius: 50%; background: #00E676; position: absolute; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; cursor: grab; transform: translate(-50%, -50%); }
  </style>
</head>
<body>
  <h1>StageLink Live - Stage Intelligence</h1>
  <div id="stage"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const stage = document.getElementById('stage');

    socket.on('initial_state', (data) => {
      data.musicians.forEach(m => renderMusician(m));
    });

    socket.on('STAGE_INTELLIGENCE_UPDATE', (data) => {
      const node = document.getElementById(`musician-${data.musicianId}`);
      if (node) {
        node.style.left = `${data.stagePosition.x}%`;
        node.style.top = `${data.stagePosition.y}%`;
      }
    });

    function renderMusician(m) {
      let node = document.getElementById(`musician-${m.id}`);
      if (!node) {
        node = document.createElement('div');
        node.id = `musician-${m.id}`;
        node.className = 'musician-node';
        node.innerText = m.name[0];
        stage.appendChild(node);
      }
      node.style.left = `${m.stagePosition.x}%`;
      node.style.top = `${m.stagePosition.y}%`;
    }
  </script>
</body>
</html>
