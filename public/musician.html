<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>StageLink Live - Personal IEM Mix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root { color-scheme: dark; }
    body { 
      background: #0b0f14; 
      touch-action: manipulation;
      /* Handles iPhone Home Bar Padding */
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      padding-top: env(safe-area-inset-top);
    }
    input[type=range] {
      accent-color: #10b981;
    }
  </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col justify-between p-4 select-none">
  <link rel="manifest" href="/manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="StageLink" />

  <!-- Header & Musician Identity -->
  <header class="flex items-center justify-between border-b border-gray-800 pb-3">
    <div>
      <h1 id="musician-name" class="text-xl font-bold text-emerald-400">Loading Mix...</h1>
      <p id="musician-inst" class="text-xs text-gray-400 uppercase tracking-widest">StageLink Live IEM</p>
    </div>
    <div class="flex items-center space-x-2 bg-gray-900 px-3 py-1.5 rounded-full border border-gray-800">
      <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
      <span id="status-text" class="text-xs text-gray-300 font-medium">Connecting</span>
    </div>
  </header>

  <!-- Talkback Intercom Banner Indicator -->
  <div id="talkback-banner" class="hidden my-2 p-3 bg-red-600/20 border border-red-500/50 rounded-lg flex items-center justify-between animate-pulse">
    <div class="flex items-center space-x-2">
      <span class="text-red-400 text-lg">📢</span>
      <span class="text-xs font-semibold text-red-200">Engineer Talkback Active</span>
    </div>
    <span class="text-xxs uppercase tracking-wider bg-red-500 text-white font-bold px-2 py-0.5 rounded">Live</span>
  </div>

  <!-- Master & Personal Mix Controls -->
  <main class="my-auto space-y-6 py-4">
    
    <!-- Master Volume Fader -->
    <div class="bg-gray-900/80 p-5 rounded-xl border border-gray-800 space-y-3">
      <div class="flex justify-between items-center">
        <label for="master-vol" class="text-sm font-semibold uppercase tracking-wider text-gray-300">Master IEM Volume</label>
        <span id="master-vol-disp" class="text-emerald-400 font-mono font-bold text-lg">80%</span>
      </div>
      <input id="master-vol" type="range" min="0" max="1" step="0.01" value="0.8" class="w-full h-3 bg-gray-800 rounded-lg appearance-none cursor-pointer" />
    </div>

    <!-- Spatial Stereo Pan Control -->
    <div class="bg-gray-900/80 p-5 rounded-xl border border-gray-800 space-y-3">
      <div class="flex justify-between items-center">
        <label for="pan-control" class="text-sm font-semibold uppercase tracking-wider text-gray-300">Stereo Position (Pan)</label>
        <span id="pan-disp" class="text-emerald-400 font-mono font-bold text-sm">Center</span>
      </div>
      <input id="pan-control" type="range" min="-1" max="1" step="0.05" value="0" class="w-full h-3 bg-gray-800 rounded-lg appearance-none cursor-pointer" />
      <div class="flex justify-between text-xxs text-gray-500 font-bold uppercase tracking-wider">
        <span>Left</span>
        <span>Center</span>
        <span>Right</span>
      </div>
    </div>

    <!-- Quick Mute / Solo Toggles -->
    <div class="grid grid-cols-2 gap-4">
      <button id="btn-mute" class="py-4 bg-gray-900 border border-gray-800 text-gray-300 rounded-xl font-bold text-sm hover:bg-gray-800 active:scale-95 transition">
        MUTE MIX
      </button>
      <button id="btn-solo" class="py-4 bg-gray-900 border border-gray-800 text-gray-300 rounded-xl font-bold text-sm hover:bg-gray-800 active:scale-95 transition">
        SOLO
      </button>
    </div>

  </main>

  <!-- PTT Intercom Controls -->
  <div class="grid grid-cols-2 gap-3 mb-4">
    <button id="talkToEngineerBtn" class="flex items-center justify-center gap-2 py-3.5 px-4 bg-gray-900 border border-gray-800 hover:border-emerald-500/50 text-gray-200 rounded-xl font-semibold text-xs uppercase tracking-wider active:bg-emerald-950 active:border-emerald-500 active:scale-95 transition">
      🎤 Call Engineer
    </button>
    <button id="talkToBandBtn" class="flex items-center justify-center gap-2 py-3.5 px-4 bg-gray-900 border border-gray-800 hover:border-emerald-500/50 text-gray-200 rounded-xl font-semibold text-xs uppercase tracking-wider active:bg-emerald-950 active:border-emerald-500 active:scale-95 transition">
      🎸 Band Intercom
    </button>
  </div>
  
  <!-- Footer Info -->
  <footer class="text-center border-t border-gray-800 pt-3">
    <p class="text-xxs text-gray-500">StageLink Live Core • Low-Latency IEM Engine</p>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const musicianId = parseInt(urlParams.get('id'), 10);

    const nameEl = document.getElementById('musician-name');
    const instEl = document.getElementById('musician-inst');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const masterVol = document.getElementById('master-vol');
    const masterVolDisp = document.getElementById('master-vol-disp');
    const panControl = document.getElementById('pan-control');
    const panDisp = document.getElementById('pan-disp');
    const btnMute = document.getElementById('btn-mute');
    const btnSolo = document.getElementById('btn-solo');
    const talkbackBanner = document.getElementById('talkback-banner');

    let currentMix = { volume: 0.8, pan: 0, mute: false, solo: false };

    if (!musicianId) {
      nameEl.textContent = 'Invalid ID';
      instEl.textContent = 'Please scan a valid QR code';
    }

    const socket = io();

    socket.on('connect', () => {
      statusDot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
      statusText.textContent = 'Live';
      fetchState();
    });

    socket.on('disconnect', () => {
      statusDot.className = 'w-2.5 h-2.5 rounded-full bg-red-500';
      statusText.textContent = 'Offline';
    });

    async function fetchState() {
      if (!musicianId) return;
      try {
        const res = await fetch('/api/state');
        const data = await res.json();
        const me = (data.musicians || []).find(m => m.id === musicianId);
        if (me) {
          nameEl.textContent = me.name;
          instEl.textContent = (me.instrument || 'Stage Performance').toUpperCase();
          if (me.mix) {
            currentMix = { ...me.mix };
            updateUI();
          }
        } else {
          nameEl.textContent = 'Musician Not Found';
        }
      } catch (err) {
        console.error('State sync error:', err);
      }
    }

    function updateUI() {
      masterVol.value = currentMix.volume;
      masterVolDisp.textContent = `${Math.round(currentMix.volume * 100)}%`;

      panControl.value = currentMix.pan;
      if (currentMix.pan === 0) panDisp.textContent = 'Center';
      else if (currentMix.pan < 0) panDisp.textContent = `${Math.abs(Math.round(currentMix.pan * 100))}% Left`;
      else panDisp.textContent = `${Math.round(currentMix.pan * 100)}% Right`;

      if (currentMix.mute) {
        btnMute.className = 'py-4 bg-red-600 border border-red-500 text-white rounded-xl font-bold text-sm active:scale-95 transition';
        btnMute.textContent = 'MUTED';
      } else {
        btnMute.className = 'py-4 bg-gray-900 border border-gray-800 text-gray-300 rounded-xl font-bold text-sm hover:bg-gray-800 active:scale-95 transition';
        btnMute.textContent = 'MUTE MIX';
      }

      if (currentMix.solo) {
        btnSolo.className = 'py-4 bg-amber-500 border border-amber-400 text-black rounded-xl font-bold text-sm active:scale-95 transition';
        btnSolo.textContent = 'SOLO ACTIVE';
      } else {
        btnSolo.className = 'py-4 bg-gray-900 border border-gray-800 text-gray-300 rounded-xl font-bold text-sm hover:bg-gray-800 active:scale-95 transition';
        btnSolo.textContent = 'SOLO';
      }
    }

    masterVol.addEventListener('input', (e) => {
      currentMix.volume = parseFloat(e.target.value);
      updateUI();
      emitMixUpdate();
    });

    panControl.addEventListener('input', (e) => {
      currentMix.pan = parseFloat(e.target.value);
      updateUI();
      emitMixUpdate();
    });

    btnMute.addEventListener('click', () => {
      currentMix.mute = !currentMix.mute;
      updateUI();
      emitMixUpdate();
    });

    btnSolo.addEventListener('click', () => {
      currentMix.solo = !currentMix.solo;
      updateUI();
      emitMixUpdate();
    });

    function emitMixUpdate() {
      if (!musicianId) return;
      socket.emit('update_mix', {
        musicianId: musicianId,
        mixUpdate: currentMix
      });
    }

    socket.on('mix_updated', (data) => {
      if (data.musicianId === musicianId && data.mix) {
        currentMix = { ...data.mix };
        updateUI();
      }
    });

    let audioCtx = null;
    let talkbackTimeout = null;

    socket.on('incoming-talkback', async (arrayBuffer) => {
      talkbackBanner.classList.remove('hidden');
      clearTimeout(talkbackTimeout);
      talkbackTimeout = setTimeout(() => {
        talkbackBanner.classList.add('hidden');
      }, 1000);

      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        const decodedData = await audioCtx.decodeAudioData(arrayBuffer.slice(0));
        const source = audioCtx.createBufferSource();
        source.buffer = decodedData;
        source.connect(audioCtx.destination);
        source.start(0);
      } catch (e) {
        console.warn('Audio streaming buffer playback pending user tap.', e);
      }
    });
  </script>
</body>
</html>
