<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>StageLink Live - Musician Mix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: dark; }
    body { background: linear-gradient(180deg,#04060a,#06101a); }
    /* Larger touch targets for mobile sliders */
    input[type=range] { -webkit-appearance: none; appearance: none; height: 36px; }
    input[type=range]::-webkit-slider-runnable-track { height: 8px; background: rgba(255,255,255,0.08); border-radius: 999px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; background: #10b981; border-radius: 999px; margin-top: -10px; box-shadow: 0 2px 6px rgba(16,185,129,0.18); }
    input[type=range]:focus { outline: none; }
  </style>
</head>
<body class="text-gray-100 min-h-screen">
  <div class="max-w-xl mx-auto p-4 space-y-4">
    <!-- Header -->
    <header class="flex items-start justify-between space-x-3">
      <div>
        <div class="flex items-baseline space-x-2">
          <h1 id="musician-name" class="text-lg font-semibold">Musician</h1>
          <span id="musician-role" class="text-sm text-gray-400">(Role)</span>
        </div>
        <div class="text-xs text-gray-400 mt-1">ID: <span id="musician-id">-</span></div>
      </div>
      <div class="flex flex-col items-end space-y-2">
        <div class="flex items-center space-x-2">
          <span id="socket-dot" class="w-3 h-3 rounded-full bg-red-600 inline-block shadow-sm"></span>
          <span id="socket-text" class="text-sm text-gray-300">Socket.io: Disconnected</span>
        </div>
        <div class="px-3 py-1 rounded-md bg-emerald-600 text-black text-xs font-semibold">WIRED MONITOR ACTIVE (Zero Latency)</div>
      </div>
    </header>

    <!-- Mix Controls -->
    <main class="bg-gray-900/40 rounded-lg border border-gray-700 p-3">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-medium">Personal Mix</h2>
        <div class="text-xs text-gray-400">Adjust levels for your in-ear monitor</div>
      </div>

      <div id="sliders" class="space-y-3">
        <!-- sliders injected here -->
      </div>

      <div class="mt-4 text-xs text-gray-400">Auto-syncs in real-time with the stage engineer. Fader moves emit 'update_mix' events.</div>
    </main>

    <footer class="text-center text-xs text-gray-500 pt-2">StageLink Live — Musician Interface</footer>
  </div>

  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <script>
    // Utility: read query params
    function getParam(name, fallback) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name) || fallback;
    }

    const musicianName = getParam('name', 'Musician');
    const musicianRole = getParam('role', 'Performer');
    const musicianId = getParam('musician', getParam('id', ('m-' + Math.random().toString(36).slice(2,9))));

    document.getElementById('musician-name').textContent = musicianName;
    document.getElementById('musician-role').textContent = `(${musicianRole})`;
    document.getElementById('musician-id').textContent = musicianId;

    // Channels (default 16) - could be overridden by query param channels=...
    const defaultChannels = ['Kick','Snare','Hi-Hat','Tom 1','Tom 2','Floor Tom','OH L','OH R','Bass','Guitar','Keys','Lead Vocal','Backing 1','Backing 2','FX','Aux'];
    const channelsParam = getParam('channels','');
    const channels = channelsParam ? channelsParam.split(',') : defaultChannels;
    const sliderContainer = document.getElementById('sliders');

    // Current mix levels
    const mix = {};
    channels.forEach((ch,i)=> mix[i] = 50);

    // Render sliders (mobile-first: horizontal, large touch targets)
    function renderSliders() {
      sliderContainer.innerHTML = '';
      channels.forEach((ch,i) => {
        const row = document.createElement('div');
        row.className = 'flex items-center space-x-3';
        row.innerHTML = `
          <div class="w-24 text-sm">${escapeHtml(ch)}</div>
          <div class="flex-1">
            <input type="range" min="0" max="100" value="${mix[i]}" id="fader-${i}" data-channel="${i}" class="w-full" />
            <div class="flex items-center justify-between text-xs text-gray-400 mt-1">
              <div>Level</div>
              <div id="val-${i}">${mix[i]}%</div>
            </div>
          </div>
        `;
        sliderContainer.appendChild(row);

        const input = row.querySelector('#fader-'+i);
        const valEl = row.querySelector('#val-'+i);
        input.addEventListener('input', (ev) => {
          const v = Number(ev.target.value);
          valEl.textContent = v + '%';
          mix[i] = v;
          // Emit immediately
          emitUpdate(i, v);
        });
      });
    }

    function escapeHtml(s) {
      return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
    }

    // Socket.io connection
    const socket = io(); // connect to same origin
    const socketDot = document.getElementById('socket-dot');
    const socketText = document.getElementById('socket-text');

    function setConnected(yes) {
      if (yes) {
        socketDot.classList.remove('bg-red-600');
        socketDot.classList.add('bg-emerald-500');
        socketText.textContent = 'Socket.io: Connected';
      } else {
        socketDot.classList.remove('bg-emerald-500');
        socketDot.classList.add('bg-red-600');
        socketText.textContent = 'Socket.io: Disconnected';
      }
    }

    socket.on('connect', () => {
      setConnected(true);
      // identify ourselves to server
      socket.emit('musician_join', { musicianId, name: musicianName, role: musicianRole });
    });
    socket.on('disconnect', () => setConnected(false));
    socket.on('connect_error', () => setConnected(false));

    // Emit update_mix events
    function emitUpdate(channel, value) {
      const payload = { musicianId, channel, value };
      try {
        socket.emit('update_mix', payload);
      } catch (e) {
        // ignore if socket not ready
      }
    }

    // Handle incoming mix updates from server
    // Support shapes: { musicianId, channel, value } or { musicianId, mix: {channel:value,...} }
    socket.on('mix_updated', (data) => {
      try {
        if (!data) return;
        // if targeting a specific musician and it doesn't match, ignore
        if (data.musicianId && data.musicianId !== musicianId) return;

        if (data.mix && typeof data.mix === 'object') {
          Object.keys(data.mix).forEach(ch => {
            const idx = Number(ch);
            const val = Number(data.mix[ch]);
            updateSliderUI(idx, val);
          });
        } else if (typeof data.channel !== 'undefined') {
          const idx = Number(data.channel);
          const val = Number(data.value);
          updateSliderUI(idx, val);
        } else if (Array.isArray(data)) {
          // maybe server sends array of levels
          data.forEach((v,idx) => updateSliderUI(idx, Number(v)));
        }
      } catch (e) { console.error('mix_updated handler error', e); }
    });

    function updateSliderUI(channelIdx, value) {
      if (!(channelIdx in mix)) return;
      mix[channelIdx] = value;
      const input = document.getElementById('fader-'+channelIdx);
      const valEl = document.getElementById('val-'+channelIdx);
      if (input) input.value = value;
      if (valEl) valEl.textContent = value + '%';
    }

    // Provide a manual sync request
    function requestCurrentMix() {
      socket.emit('request_mix', { musicianId });
    }

    // Init
    renderSliders();
    // once connected, request server's mix state for this musician
    socket.on('connect', () => requestCurrentMix());

    // Keyboard accessibility: tap area increases
    document.addEventListener('touchstart', function() {}, {passive:true});
  </script>
</body>
</html>
