<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>StageLink Mobile - Musician Mix</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Socket.IO client -->
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root { color-scheme: dark; }
    body { background: linear-gradient(180deg,#0b0f14,#081018); }
    .slider { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.1); outline: none; }
    .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #10b981; cursor: pointer; }
    .status-dot { width: 12px; height: 12px; border-radius: 999px; display: inline-block; box-shadow: 0 0 8px rgba(0,0,0,0.6); }
  </style>
</head>
<body class="text-gray-100 min-h-screen p-4 max-w-md mx-auto flex flex-col justify-between">
  <div>
    <!-- Header -->
    <header class="flex items-center justify-between pb-4 border-b border-gray-800 mb-6">
      <div>
        <h1 class="text-lg font-bold">Musician <span class="text-xs font-normal text-gray-400">(Performer)</span></h1>
        <p id="musician-id-display" class="text-xs text-gray-400">Loading ID...</p>
      </div>
      <div class="flex items-center space-x-2">
        <span id="conn-dot" class="status-dot bg-red-600"></span>
        <span id="conn-text" class="text-xs text-gray-300">Connecting...</span>
      </div>
    </header>

    <!-- Audio Unlock Overlay / Button (Mandatory for mobile browsers) -->
    <div id="audio-unlock-banner" class="mb-6 p-4 bg-emerald-600/20 border border-emerald-500 rounded-lg text-center shadow-lg">
      <p class="text-xs text-emerald-300 mb-2 font-medium">Mobile browser security requires interaction to enable live audio monitoring.</p>
      <button id="unlock-audio-btn" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-black font-bold rounded-lg text-sm transition shadow">
        🔊 Tap to Enable Monitor Audio
      </button>
    </div>

    <!-- Talkback Alert Banner (Shows when engineer is speaking) -->
    <div id="talkback-alert" class="hidden mb-4 p-3 bg-red-600/20 border border-red-500 rounded-lg text-red-400 text-center text-sm font-semibold animate-pulse">
      🔴 ENGINEER TALKBACK ACTIVE
    </div>

    <!-- Personal Mix Controls -->
    <main class="space-y-6">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-medium text-gray-300 uppercase tracking-wider">Personal Mix</h2>
        <span class="text-xs text-gray-400">Adjust levels for your in-ear monitor</span>
      </div>

      <div id="mix-sliders" class="space-y-4">
        <!-- Sliders injected dynamically -->
      </div>
    </main>
  </div>

  <!-- Hidden Audio Element for playing incoming stream chunks -->
  <audio id="talkback-audio" style="display:none;"></audio>

  <footer class="mt-8 pt-4 border-t border-gray-800 text-center text-xs text-gray-500">
    StageLink Live Core &bull; Zero Latency Monitor
  </footer>

  <script>
    const socket = io();

    const urlParams = new URLSearchParams(window.location.search);
    const musicianId = urlParams.get('id') || '1';
    document.getElementById('musician-id-display').textContent = `ID: ${musicianId}`;

    const connDot = document.getElementById('conn-dot');
    const connText = document.getElementById('conn-text');
    const mixSlidersContainer = document.getElementById('mix-sliders');
    const talkbackAlert = document.getElementById('talkback-alert');
    const unlockAudioBtn = document.getElementById('unlock-audio-btn');
    const audioUnlockBanner = document.getElementById('audio-unlock-banner');
    const talkbackAudio = document.getElementById('talkback-audio');

    let audioUnlocked = false;

    unlockAudioBtn.addEventListener('click', () => {
      // Force play an empty sound or load state to unlock mobile audio context sandbox
      talkbackAudio.play().catch(() => {});
      audioUnlocked = true;
      audioUnlockBanner.style.display = 'none';
      console.log('Mobile audio successfully unlocked by user gesture.');
    });

    socket.on('connect', () => {
      connDot.classList.remove('bg-red-600');
      connDot.classList.add('bg-emerald-500');
      connText.textContent = 'Socket.io: Connected';
    });

    socket.on('disconnect', () => {
      connDot.classList.remove('bg-emerald-500');
      connDot.classList.add('bg-red-600');
      connText.textContent = 'Disconnected';
    });

    // Receive initial state and build mix sliders
    socket.on('initial_state', (data) => {
      renderMixControls(data.audioChannels);
    });

    function renderMixControls(channels) {
      mixSlidersContainer.innerHTML = '';
      channels.forEach((ch) => {
        const row = document.createElement('div');
        row.className = 'bg-gray-900/40 p-4 rounded-lg border border-gray-800 space-y-2';
        row.innerHTML = `
          <div class="flex justify-between items-center text-sm">
            <span class="font-medium capitalize">${ch.name}</span>
            <span id="val-${ch.id}" class="text-xs text-gray-400">50%</span>
          </div>
          <input type="range" min="0" max="100" value="50" class="slider" data-channel-id="${ch.id}" />
        `;
        mixSlidersContainer.appendChild(row);

        const slider = row.querySelector('input');
        slider.addEventListener('input', (e) => {
          const val = e.target.value;
          document.getElementById(`val-${ch.id}`).textContent = `${val}%`;
          socket.emit('update_mix', {
            musicianId: musicianId,
            mixUpdate: { [ch.name]: val / 100 }
          });
        });
      });
    }

    // Direct Blob Audio Chunk Queue Streaming
    socket.on('incoming-talkback', (audioChunk) => {
      if (!audioUnlocked) return; // Ignore if user hasn't tapped unlock yet

      talkbackAlert.classList.remove('hidden');

      try {
        const blob = new Blob([audioChunk], { type: 'audio/webm' });
        const audioUrl = URL.createObjectURL(blob);
        
        talkbackAudio.src = audioUrl;
        talkbackAudio.play().catch(err => {
          console.warn('Playback error:', err);
        });
      } catch (err) {
        console.error('Error handling talkback chunk:', err);
      }

      clearTimeout(window.talkbackTimeout);
      window.talkbackTimeout = setTimeout(() => {
        talkbackAlert.classList.add('hidden');
      }, 500);
    });
  </script>
</body>
</html>
